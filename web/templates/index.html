<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FPGA 8-mic levels</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        padding: 12px;
        background: #0b0f14;
        color: #e6edf3;
        max-width: 520px;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 10px;
      }
      .card {
        background: #111827;
        border: 1px solid #243244;
        border-radius: 10px;
        padding: 12px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .small {
        font-size: 0.85rem;
        opacity: 0.88;
      }
      #status {
        margin-top: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #243244;
      }
      th {
        font-weight: 600;
        font-size: 0.8rem;
        opacity: 0.75;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <h1>FPGA 8-mic (dBFS)</h1>
    <div class="card">
      <div id="status" class="small">Loading…</div>
      <table aria-label="Per-channel levels">
        <thead>
          <tr>
            <th>Mic</th>
            <th>dBFS</th>
          </tr>
        </thead>
        <tbody id="meterBody"></tbody>
      </table>
      <div class="row small" id="mixRow" style="margin-top: 8px"></div>
      <div class="row">
        <button type="button" id="recordMic1Btn" title="Record 15sec .WAV -ch1">
          Record 15sec .WAV -ch1
        </button>
        <span id="recordMic1Status" class="small"></span>
      </div>
      <div class="row">
        <button type="button" id="alnAlignBtn" title="PI_ALN: zeros, sync frame, then TDM">
          Run FPGA TDM alignment (PI_ALN)
        </button>
        <span id="alnAlignStatus" class="small"></span>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
