<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carlton Mars Lab — FPGA mic levels</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        padding: 12px;
        background: #0b0f14;
        color: #e6edf3;
        max-width: 560px;
      }
      .site-header {
        margin-bottom: 12px;
      }
      .brand-logo {
        background: #fff;
        color: #2a4a9a;
        font-weight: 700;
        font-size: 1.2rem;
        padding: 8px 14px;
        border-radius: 6px;
        display: inline-block;
        letter-spacing: 0.02em;
      }
      .brand-tag {
        margin: 8px 0 0;
        font-size: 0.95rem;
        opacity: 0.92;
      }
      .card {
        background: #111827;
        border: 1px solid #243244;
        border-radius: 10px;
        padding: 12px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .small {
        font-size: 0.85rem;
        opacity: 0.88;
      }
      #status {
        margin-top: 8px;
        line-height: 1.45;
      }
      #status.status-ok {
        color: #86efac;
      }
      #status.status-warn {
        color: #fbbf24;
      }
      #status.status-err {
        color: #fca5a5;
      }
      #micHealth {
        margin-top: 6px;
        font-size: 0.88rem;
        line-height: 1.4;
        padding: 6px 0;
      }
      #micHealth.ok {
        color: #4ade80;
      }
      #micHealth.warn {
        color: #fbbf24;
      }
      #micHealth.muted {
        opacity: 0.75;
      }
      #captureHint {
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #0f172a;
        border: 1px solid #334155;
        font-size: 0.8rem;
        line-height: 1.4;
      }
      #captureHint.warn {
        border-color: #b45309;
        background: #1c1410;
      }
      #captureHint.err {
        border-color: #b91c1c;
        background: #1c1010;
      }
      #alnDetail {
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #0c1220;
        border: 1px solid #1e3a5f;
        font-size: 0.78rem;
        line-height: 1.45;
        min-height: 2.5em;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #243244;
      }
      th {
        font-weight: 600;
        font-size: 0.8rem;
        opacity: 0.75;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        background: #334155;
      }
      #alnAlignBtn.aln-busy {
        opacity: 1;
        border-color: #38bdf8;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
        background: #0f172a;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="brand-logo">Carlton Mars Lab</div>
      <p class="brand-tag">FPGA 8-mic levels (dBFS)</p>
    </header>
    <div class="card">
      <div id="status" class="small">Polling server…</div>
      <div id="micHealth" class="small muted" aria-live="polite"></div>
      <div id="captureHint" class="small" style="display: none"></div>
      <table aria-label="Per-channel levels">
        <thead>
          <tr>
            <th>Mic</th>
            <th>dBFS</th>
          </tr>
        </thead>
        <tbody id="meterBody">
          <tr><td>1 L</td><td>—</td></tr>
          <tr><td>1 R</td><td>—</td></tr>
          <tr><td>2 L</td><td>—</td></tr>
          <tr><td>2 R</td><td>—</td></tr>
          <tr><td>3 L</td><td>—</td></tr>
          <tr><td>3 R</td><td>—</td></tr>
          <tr><td>4 L</td><td>—</td></tr>
          <tr><td>4 R</td><td>—</td></tr>
        </tbody>
      </table>
      <div class="row small" id="mixRow" style="margin-top: 8px"></div>
      <div class="row">
        <button type="button" id="recordMic1Btn" title="Record 15sec .WAV -ch1">
          Record 15sec .WAV -ch1
        </button>
        <span id="recordMic1Status" class="small"></span>
      </div>
      <div class="row">
        <button type="button" id="alnAlignBtn" title="PI_ALN: zeros, sync frame, then TDM">
          Run FPGA TDM alignment (PI_ALN)
        </button>
        <span id="alnAlignStatus" class="small"></span>
      </div>
      <div id="alnDetail" class="small" style="margin-top: 8px">
        Backend steps appear here while alignment runs (poll <code>/health</code>).
      </div>
    </div>
    <noscript>
      <p style="color: #f87171">Enable JavaScript — this dashboard needs it to poll <code>/health</code>.</p>
    </noscript>
    <script src="/static/app.js"></script>
  </body>
</html>
